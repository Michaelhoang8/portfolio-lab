name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check portfolio/static/app.js
      - run: node --check portfolio/static/data.js
      - run: node --check portfolio/static/security.js
      - run: node --check portfolio/static/ml.js
      - run: node --check portfolio/static/devops.js
      - run: node --check portfolio/static/rest_transport.js
      - run: node --check portfolio/static/rest.js
      - run: node --check portfolio/static/identities.js
      - run: node --check portfolio/static/capabilities.js
      - run: node --check portfolio/static/observatory.js
      - run: node --test tests/ui_requests.test.cjs tests/ui_csv_columns.test.cjs tests/ui_utilities.test.cjs tests/ui_rest_transport.test.cjs tests/ui_workspace.test.cjs
      - run: node --check portfolio/static/csv_columns.js
